stages:
  - deploy

deploy-backend:
  stage: deploy
  image: node:20-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "cart_branch"
      changes:
        - Backend/**/*
  before_script:
    - npm install -g @railway/cli
  script:
    - cd Backend
    - railway up --service Fremtidsmat --detach
  environment:
    name: production

deploy-frontend:
  stage: deploy
  image: node:20-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "cart_branch"
      changes:
        - Frontend/**/*
  before_script:
    - npm install -g @railway/cli
  script:
    - cd Frontend
    - railway up --service Frontend --detach
  environment:
    name: production
